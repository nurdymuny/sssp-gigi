[package]
name = "sssp_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
rand_chacha = "0.3"
gigi = { path = "C:/Users/nurdm/OneDrive/Documents/gigi", optional = true }

[features]
default = ["engine"]
engine = ["dep:gigi"]

[[bin]]
name = "gigi_gate"
required-features = ["engine"]

[[bin]]
name = "faithful"
required-features = ["engine"]

[[bin]]
name = "substrate"
required-features = ["engine"]

[[bin]]
name = "potential_order"
required-features = ["engine"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
